<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NexPlay</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="formulario.css">
    </head>

    <body>
        <h1 class="nexplay"><a href="home.html">NexPlay</a></h1>
        <h1 id="contatonexplay">Contato</h1>
        <hr>
        <nav class="menu-navegacao">
            <a href="home.html">Home</a>
            <a href="produtos.html">Produtos</a>
            <a href="contato.html">Contato</a>
            <a href="apresentacao.html">Apresentação</a>
        </nav>
        
        <hr>
        <p id="formulario">Preencha o formulário para falar com o suporte</p> 
        
        <form action="" class="botoes">
            <div class="campo">
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" placeholder="Digite o seu nome..." required>
            </div>

            <div class="campo">
                <label for="email">Email: </label>
                <input type="email" name="email" id="email" placeholder="Digite o seu email..." required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone: </label>
                <input type="tel" name="telefone" id="telefone" placeholder="Digite o seu telefone.." required>
            </div>

            <div class="campo"> 
                <label for="motivo">Motivo</label>
                <select id="motivo" name="motivo" required>
                    <option value="" disabled selected hidden>Selecione um motivo</option>
                    <option value="avaliar">Avaliar o site</option>
                    <option value="reembolso">Reembolso</option>
                    <option value="duvida">Tirar dúvidas</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            
            <div class="campo">
                <label for="data">Data do atendimento</label>
                <input type="date" id="data" name="data">
            </div>

            <div class="campo">
                <label for="texto">Digite a sua dúvida e entraremos em contato pelo email cadastrado.</label>
                <textarea name="texto" id="texto"></textarea>
            </div>
            

            <button type="submit">Enviar</button>

        </form>
    </body>
</html>
